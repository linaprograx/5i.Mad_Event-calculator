<title>Herramientas 5i Madrid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--ground:#0B100D;--surface:#121915;--line:#26332A;--ink:#E9F0EA;--dim:#93A798;--fairway:#5FC97F}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans',Arial,sans-serif;margin:0;
  padding:0 20px 60px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto}
p.brand{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--fairway);margin:0 0 8px;padding-top:56px}
h1{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:clamp(28px,6vw,42px);letter-spacing:-.025em;
  line-height:1.05;margin:0 0 10px}
p.lede{color:var(--dim);margin:0 0 34px;max-width:52ch}
a.card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);
  border-left:2px solid var(--fairway);border-radius:4px;padding:17px 19px;margin-bottom:11px}
a.card:hover{border-color:var(--fairway)}
a.card b{display:block;font-family:'Archivo',Arial,sans-serif;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:3px}
a.card span{color:var(--dim);font-size:13.5px}
footer{color:#65786B;font-size:11.5px;margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
</style>
<div class="wrap">
  <p class="brand">Five Iron Golf · Madrid</p>
  <h1>Herramientas de gerencia</h1>
  <p class="lede">Uso interno de dirección y F&amp;B.</p>
  <a class="card" href="/tarifador"><b>Tarifador de eventos</b><span>Precio por persona, suelo, margen y propuesta lista para enviar.</span></a>
  <a class="card" href="/docs/tarifador"><b>Cómo funciona el tarifador</b><span>De dónde sale cada número y con qué lógica decide. Para explicárselo a cualquiera.</span></a>
  <footer>events@5iberia.com</footer>
</div>
